function battlegroupTreeFor(p){return BATTLEGROUP_TREES?.[p.faction]?.[p.battlegroup]||null}

function renderSources(){$("sourcesView").innerHTML=`<div class="card"><h2>Sources and methodology</h2><div class="notice"><strong>Patch status:</strong> The current client patch is 2.5.5 as of 10 Sep 2026. Hot Fix 2.5.5 addressed the artillery barrage cooldown exploit and logging and did not announce battlegroup-tree changes. Cached CoHDB ranking/map/statistical tables collected on 2.5.3 remain explicitly labelled as 2.5.3 snapshots rather than being silently relabelled. The ELO selector covers all six official CoHDB Average Rating bands. v1.1 team-composition behavior is preserved.</div><div class="goodnotice" style="margin-top:10px"><strong>Community / attribution note:</strong> This is an unofficial community project and is not affiliated with Relic, CoHDB, CoH3Stats or the featured creators. Creator builds are preserved from supplied videos, transcripts or screenshots and should not be read as creator endorsement of this advisor. Creator-original sequences may omit routine tech/building steps shown elsewhere in the source; the green tech-QA badge applies to Current Advisor profiles, not historical creator recaps.</div><div class="methodgrid" style="margin-top:12px"><div class="methoditem"><b>Confidence</b><div class="small muted">Current patch evidence quality.</div></div><div class="methoditem"><b>Matchup</b><div class="small muted">Existing opponent-specific advisor ranking.</div></div><div class="methoditem"><b>Map fit</b><div class="small muted">Qualitative strategic inference; not a fake map WR.</div></div><div class="methoditem"><b>ELO context</b><div class="small muted">Relative performance within the same faction plus sample stability.</div></div></div><div class="goodnotice" style="margin-top:10px"><strong>v1.1.4 icon-loading fix:</strong> The icon loader now uses the current COH3 Stats data tag (v2.5.3-3), tries CORS-friendly GitHub raw data before the COH3 Stats data CDN, checks additional icon fields, retries the CDN flatten path, and includes exact Luftwaffe icon fallbacks so the tree no longer depends on one remote JSON request succeeding.<br><br><strong>v1.1.3 numbered battlegroup-order update:</strong> All 28 battlegroups now have a structured 1v1/2v2 small-game baseline with a six-step cross-branch pick order. Yellow badges on the visual tree show the recommended selection sequence. The recommendation layer is explicitly expert/advisor synthesis, not a measured CoHDB unlock-order statistic. 3v3/4v4 numbered overrides remain intentionally separate and are not inferred from small-game orders.<br><br><strong>v1.1.3 icon tree update:</strong> Battlegroup nodes now load the corresponding in-game ability icons from the COH3 Stats open-data/CDN source, with a text fallback if the remote icon cannot be loaded. The recommendation banner now simply says <strong>Recommendation</strong>.<br><br><strong>v1.1.2 visual battlegroup-tree update:</strong> Battlegroups now render as a visual node-based tree inspired by the 3HappyDolphin battlegroup view. The centralized Step 1 technical tree is displayed branch-by-branch, and any stored strict recommendation is highlighted directly on the diagram. Exact cross-branch numbered pick order will be expanded further as more structured recommendation data is added.<br><br><strong>v1.1.1 canonical battlegroup-tree update:</strong> All 28 battlegroups now use a single centralized technical tree. The old per-profile <code>unlocks</code> arrays were removed. DAK prerequisite/exclusivity errors were corrected, and any strict recommended path is runtime-validated before display. Kriegsmarine now encodes Hardpoints → Improved Hardpoints → Supply Interdiction as the validated logistics path; Flares remains a separate legal branch.<br><br><strong>v1.1 team-composition update:</strong> 3v3/4v4 now accept the full enemy faction lineup. Battlegroup ranking uses the selected composition, and the displayed build resolves AT/AI/indirect-fire alternatives according to qualitative matchup risk while preserving the stored legal tech shell.<br><br><strong>v1.0.1 DAK QA update:</strong> DAK battlegroup recommendations now separate priorities/branches instead of implying one forced unlock chain. Kriegsmarine Hardpoints ordering, Armored Support ability attribution, Elite Forces 1v1 sequencing and DAK team-game wording were reviewed. <br><br><strong>v1.0 full tech-legality audit:</strong> all 112 Current Advisor profiles across Wehrmacht, DAK, USF and British were checked against the current patch-2.5.3 production roster. Missing building prerequisites, tech upgrades and production unlocks were corrected. Creator-original builds remain unchanged and are labelled separately.</div><h3 style="margin-top:20px">Advisor Score</h3><p>The score starts from a neutral baseline, then adds profile confidence, opponent-specific rank, map fit, recovery safety and ELO-relative battlegroup context. It is designed for practical selection and is <strong>not</strong> presented as a measured win probability.</p><div style="margin-top:14px">${SOURCES.map(x=>`<div class="source"><div><strong>${x.name}</strong><div class="muted small">${x.note}</div></div><a href="${x.url}" target="_blank" rel="noopener noreferrer">Open ↗</a></div>`).join("")}</div><h3 style="margin-top:20px">Data architecture</h3><p>The v1.1.4 download remains a self-contained HTML file for easy local use. The JSON export now stores <code>battlegroupTrees</code> once per battlegroup and <code>battlegroupRecommendations</code> separately from mode profiles. The page validates strict recommendation paths against the canonical tree at runtime, so an illegal prerequisite jump or mutually exclusive sequence is blocked instead of displayed.</p></div>`}
