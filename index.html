<body>
<div class="shell">
  <div class="top">
    <div>
      <h1>CoH3 Build Advisor v1.1.34</h1>
      <div class="muted">Unofficial community tool • all four factions • Smart Advisor for 1v1 / 2v2 / 3v3 / 4v4 • map + ELO context • creator comparison</div>
    </div>
    <div>
      <div class="patch">Patch 2.5.6 • 1v1 / 2v2 / 3v3 / 4v4 Smart Advisor</div>
      <div class="communitylinks">
        <a class="communitylink" href="https://github.com/ggGerrit15/coh3-build-advisor/discussions" target="_blank" rel="noopener noreferrer">💬 Community</a>
        <a class="communitylink" href="https://github.com/ggGerrit15/coh3-build-advisor/issues/new/choose" target="_blank" rel="noopener noreferrer">🐛 Report Issue</a>
        <a class="communitylink" href="https://buymeacoffee.com/gggerrit15" target="_blank" rel="noopener noreferrer">☕ Support the Project</a>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="advisor">Smart Build Advisor</button>
    <button class="tab" data-view="match">Match Mode</button>
    <button class="tab" data-view="creators">Creator Builds</button>
    <button class="tab" data-view="rankings">Battlegroup Rankings</button>
    <button class="tab" data-view="sources">Sources / Method</button>
  </div>
  <div id="advisorView">
    <div class="controls">
      <div><label>Your faction</label><select id="faction"></select></div>
      <div><label>Mode</label><select id="mode"></select></div>
      <div><label>Map type</label><select id="maptype"><option>Balanced</option><option>Open / mobile</option><option>Lane-heavy</option><option>Urban / close</option></select></div>
      <div><label>Your ELO band</label><select id="elo"><option selected>All Ratings</option><option>Under 1000</option><option>1000-1200</option><option>1200-1400</option><option>1400-1600</option><option>1600-1800</option><option>1800+</option></select></div>
      <div><label>Battlegroup</label><select id="bg"></select></div>
      <div><button class="action" id="recommended">Use Smart #1</button></div>
    </div>
    <div id="advisorContent"></div>

function findDecision(rows,words,fallback){const all=[...(rows||[])];const r=all.find(x=>words.some(w=>(x[0]+" "+x[1]).toLowerCase().includes(w)));return r||fallback}
function renderMatch(){
  const p=currentProfile();
  if(!p)return;
  if(p.mode==="All Modes"){
    $("matchContent").innerHTML='<div class="card"><h2>Choose a mode for the Match Guide</h2><p class="muted">Match advice and build decisions depend on the exact team size. Open one of the mode-specific guides for '+p.battlegroup+'.</p>'+
      '<div class="smartactions">'+p.modeProfiles.map(profile=>'<button onclick="openExactMode(\''+profile.mode+'\')">Open '+profile.mode+' guide</button>').join("")+'</div></div>';
    return;
  }
  const displayBuild=effectiveBuild(p),sc=scoreProfile(p,maptype.value,elo.value);
  const rows=[...(p.branches||[]),...(teamMode(p.mode)?teamAdjustmentRows(p):[])];
  const lv=findDecision(rows,["lv","vehicle","motor pool","greyhound","stuart","8 rad","flak"],["Fast vehicle spotted","Add reliable AT before greedy tech","Keep field safety first."]);
  const inf=findDecision(rows,["infantry","mg","team-weapon","team weapon","rifle","section"],["Infantry / team weapons","Use anti-infantry power and flanking tools","Avoid equal frontal trades."]);
  const ahead=findDecision(rows,["ahead","fuel lead"],["You are ahead","Keep minimum AT, then accelerate the next power spike","Convert the lead without gambling it."]);
  const behind=findDecision(rows,["behind","fuel-starved","fuel starved","lost fuel"],["You are behind","Heal and secure anti-vehicle safety before expensive tech","Stabilize the field first."]);
  $("matchContent").innerHTML='<div class="matchwrap"><div class="matchhero"><div class="card"><div class="tags"><span class="tag">'+p.faction+'</span><span class="tag">'+p.mode+'</span><span class="tag">'+maptype.value+'</span><span class="tag">'+p.battlegroup+'</span></div>'+
    '<h2>'+p.battlegroup+'</h2><div class="matchbuild">'+buildHtml(displayBuild)+'</div></div>'+
    '<div class="card"><div class="matchscore">'+sc.score+'</div><div class="muted">Advisor Score / 100</div><p><strong>'+elo.value+'</strong>: '+sc.eloInfo.label+'</p><button class="action" onclick="switchView(\'advisor\')">Back to full advisor</button></div></div>'+
    teamCompositionSection(p)+
    '<div class="card"><h2>Decision guide</h2><div class="decisiongrid">'+[["Fast vehicle?",lv],["Infantry / MG?",inf],["Ahead?",ahead],["Behind?",behind]].map(pair=>'<div class="decision"><strong>'+pair[0]+'</strong><div>'+pair[1][1]+'</div><div class="small muted" style="margin-top:6px">'+pair[1][2]+'</div></div>').join("")+'</div></div>'+
    '<div class="card"><h2>Build by phase</h2><div class="phasegrid">'+phaseBuild(displayBuild).map((ph,i)=>'<div class="phase"><h4>'+(i+1)+'. '+ph.name+'</h4><div class="phasesteps">'+ph.steps.map(x=>'<div class="phasestep">'+x+'</div>').join("")+'</div></div>').join("")+'</div></div>'+
    '<div class="card"><h2>Matchup scouting notes</h2>'+matchupDecisionSections(p.faction)+'</div>'+battlegroupUnlockCard(p,"Battlegroup unlocks")+'</div>';
}
function useRecommended(){const r=recommendation();if(r){bg.value=r.p.battlegroup;renderAdvisor()}}
function refreshCreatorFilters(){options(cname,['All',...uniq(CREATOR_BUILDS.map(c=>c.creator)).sort()]);options(cfac,['All',...uniq(CREATOR_BUILDS.map(c=>c.faction)).sort()]);options(cmode,['All',...uniq(CREATOR_BUILDS.flatMap(c=>c.modes||[])).sort()]);refreshCreatorBG()}
function refreshCreatorBG(){let rows=CREATOR_BUILDS;if(cname.value!=='All')rows=rows.filter(c=>c.creator===cname.value);if(cfac.value!=='All')rows=rows.filter(c=>c.faction===cfac.value);if(cmode.value!=='All')rows=rows.filter(c=>(c.modes||[]).includes(cmode.value));const old=cbg.value;options(cbg,['All',...uniq(rows.map(c=>c.battlegroup)).sort()]);if([...cbg.options].some(o=>o.value===old))cbg.value=old;renderCreators()}
function renderCreators(){let rows=CREATOR_BUILDS;if(cname.value!=='All')rows=rows.filter(c=>c.creator===cname.value);if(cfac.value!=='All')rows=rows.filter(c=>c.faction===cfac.value);if(cmode.value!=='All')rows=rows.filter(c=>(c.modes||[]).includes(cmode.value));if(cbg.value!=='All')rows=rows.filter(c=>c.battlegroup===cbg.value);$("creatorContent").innerHTML=`<div class="card" style="margin-top:14px"><h2>Creator Build Library <span class="countbadge">${rows.length} shown / ${CREATOR_BUILDS.length} saved</span></h2><p class="muted">Original builds stay preserved. Use Current vs Creator in the Smart Advisor for a direct patch-aware comparison.</p></div><div class="creatorgrid">${rows.map(creatorMiniCard).join("")}</div>`}
function refreshRankControls(){options(rmode,modeOptions(rfac.value));renderRank()}
function renderRank(){
  const rows=smartRows(rfac.value,rmode.value,rmap.value,relo.value);
  const explanation=rmode.value==="All Modes"?"CoHDB uses its native All Modes rows; matchup rank and confidence are averaged across the four exact-mode profiles.":"Matchup rank averages the available enemy-faction rankings.";
  $("rankContent").innerHTML='<div class="card" style="margin-top:14px"><h2>'+rfac.value+' '+rmode.value+' — Average matchup ranking</h2><p class="muted">'+rmap.value+' · ELO '+relo.value+'</p><p class="small muted">'+explanation+'</p>'+rows.map((x,i)=>'<div class="rankrow"><div class="rank">'+(i+1)+'</div><div><strong>'+x.p.battlegroup+'</strong><div class="small muted">'+(BG_META?.[x.p.faction]?.[x.p.battlegroup]?.style||"")+'</div></div><div class="conf '+cclass(x.p.confidence)+'">'+x.p.confidence+'</div><div><strong>'+x.score+'/100</strong></div><div class="muted">'+smartReason(x)+' • '+x.eloInfo.scopeLabel+": "+x.eloInfo.label+'</div></div>').join("")+'</div>';
}
function wilsonLB(w,n){if(!n)return 0;const z=1.96,p=w/n,z2=z*z;return (p+z2/(2*n)-z*Math.sqrt((p*(1-p)+z2/(4*n))/n))/(1+z2/n)}
function sampleLabel(n){if(n<30)return 'Too sparse';if(n<100)return 'Weak';if(n<300)return 'Useful / uncertain';return 'Stable descriptive'}
function renderTeamStats(){
  const m=tmode?.value||"4v4",f=tfaction?.value||"Wehrmacht",sort=tsort?.value||"wilson";
  const a=TEAM_ARCHETYPES[f],ar=a?.[m],maps=TEAM_MAP_STATS[m]||[];
  const battlegroups=cohdbModeBattlegroups(f,m);
  const rows=battlegroups.map(name=>{
    const stat=cohdbModeAllRatingsStat(f,name,m);
    return stat?{...stat,name,w:stat.wins,l:stat.losses,lb:100*wilsonLB(stat.wins,stat.n)}:null;
  }).filter(Boolean);
  rows.sort((x,y)=>sort==="wr"?y.wr-x.wr:sort==="n"?y.n-x.n:y.lb-x.lb);
  const patchLabel=escapeHtml(COHDB_SNAPSHOT?.patch?.label||"unknown");
  const tableRows=rows.length?rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td><strong>'+r.name+'</strong></td><td class="num">'+r.w.toLocaleString()+'–'+r.l.toLocaleString()+'</td><td class="num">'+r.wr.toFixed(1)+'%</td><td class="num">'+r.n.toLocaleString()+'</td><td class="num">'+r.coverage+'/'+r.expectedRows+'</td><td class="num">'+r.lb.toFixed(1)+'%</td><td>'+sampleLabel(r.n)+(r.complete?"":" · partial")+'</td></tr>').join(""):'<tr><td colspan="8">No current-patch battlegroup rows were imported for this mode.</td></tr>';
  const bgBlock='<div class="card"><h2>Current-patch '+m+' battlegroup statistics — '+f+'</h2><div class="info">CoHDB scope: <strong>Patch '+patchLabel+' · '+m+' · All Ratings · All Maps</strong>. The combined sample adds the available six Average Rating bands. Partial coverage is shown in the table and is excluded from Advisor Score. Balanced (all ratings) is a separate cohort. Sorted by '+(sort==="wilson"?"95% Wilson lower bound":sort==="wr"?"raw win rate":"sample size")+'.</div>'+
    '<div class="teamtablewrap" style="margin-top:12px"><table class="teamtable"><thead><tr><th>#</th><th>Battlegroup</th><th class="num">Record</th><th class="num">Raw WR</th><th class="num">Games</th><th class="num">Rating groups</th><th class="num">95% Wilson LB</th><th>Sample</th></tr></thead><tbody>'+tableRows+'</tbody></table></div>'+
    '<div class="small muted" style="margin-top:9px">Raw win rate describes battlegroup selections in this current-patch sample; it does not prove that the battlegroup caused the result.</div></div>';
  const archetype=ar?'<div class="card"><h2>Representative exact-mode build archetype — '+f+'</h2><div class="teamkpis"><div class="teamkpi"><div class="small muted">Archetype</div><div><strong>'+a.name+'</strong></div></div><div class="teamkpi"><div class="small muted">'+m+' record</div><div class="big">'+ar.w.toLocaleString()+'–'+ar.l.toLocaleString()+'</div></div><div class="teamkpi"><div class="small muted">Raw WR</div><div class="big">'+ar.wr.toFixed(1)+'%</div></div><div class="teamkpi"><div class="small muted">Games</div><div class="big">'+ar.n.toLocaleString()+'</div></div></div><p class="muted">'+a.note+'</p><a href="'+a.url+'" target="_blank" rel="noopener noreferrer">Open archetype on CoHDB ↗</a></div>':"";
  const mapRows=maps.map(x=>'<tr><td>'+x.map+'</td><td class="num">'+x.alliesWr.toFixed(1)+'%</td><td class="num">'+x.n.toLocaleString()+'</td><td><div class="mapbar"><span style="width:'+Math.max(0,Math.min(100,x.alliesWr))+'%"></span></div></td></tr>').join("");
  const mapBlock='<div class="card"><h2>'+m+' map balance context</h2><div class="info">CoHDB map table: Patch 2.5.3 · Balanced (all ratings). <strong>Allies WR is overall map context</strong>, not a faction- or battlegroup-specific win rate.</div><div class="teamtablewrap" style="margin-top:12px"><table class="teamtable"><thead><tr><th>Map</th><th class="num">Allies WR</th><th class="num">Games</th><th>Balance bar</th></tr></thead><tbody>'+mapRows+'</tbody></table></div></div>';
  const method='<div class="card"><h2>How to read these team-game numbers</h2><div class="methodgrid"><div class="methoditem"><b>Battlegroup table</b><div class="small muted">Current patch and exact mode; Average Rating bands are combined, and incomplete coverage is labelled.</div></div><div class="methoditem"><b>Archetype</b><div class="small muted">Exact mode, but a build/tech cluster rather than a battlegroup. Late-tech categories can have survivorship bias.</div></div><div class="methoditem"><b>Map context</b><div class="small muted">Overall Allies map WR, not a specific army or BG.</div></div><div class="methoditem"><b>Wilson LB</b><div class="small muted">Conservative 95% lower bound used to avoid overrating smaller samples.</div></div></div></div>';
  if($("teamStatsContent"))$("teamStatsContent").innerHTML='<div style="margin-top:14px">'+bgBlock+archetype+mapBlock+method+'</div>';
}
function renderSources(){
  $("sourcesView").innerHTML='<div class="card"><h2>Sources and methodology</h2>'+
    '<div class="notice"><strong>Patch status:</strong> CoHDB battlegroup statistics were retrieved on 23 Sep 2026 from patch 2.5.6 (patch ID 50313). The snapshot includes All Modes and 1v1–4v4, plus Balanced (all ratings) and six Average Rating bands. Mode statistics use current-patch, all-map records. All Ratings combines the available Average Rating bands. Missing rating groups are listed in coverage metadata, shown as partial in the interface and excluded from Advisor Score.</div>'+
    '<div class="goodnotice" style="margin-top:10px"><strong>Matchup context:</strong> The Advisor Score averages the available curated enemy-faction rankings. Scouting notes remain available by faction in the Match Guide. 3v3/4v4 provide general team-game scouting prompts.</div>'+
    '<div class="goodnotice" style="margin-top:10px"><strong>Community / attribution note:</strong> This is an unofficial community project and is not affiliated with Relic, CoHDB, CoH3Stats or the featured creators. Creator builds are preserved from supplied videos, transcripts or screenshots and should not be read as creator endorsement of this advisor. Creator-original sequences may omit routine tech/building steps shown elsewhere in the source; the green tech-QA badge applies to Current Advisor profiles, not historical creator recaps.</div>'+
    '<div class="methodgrid" style="margin-top:12px"><div class="methoditem"><b>Confidence</b><div class="small muted">Current-patch evidence quality.</div></div><div class="methoditem"><b>Matchup</b><div class="small muted">Average advisor rank across available enemy-faction rankings.</div></div><div class="methoditem"><b>Map fit</b><div class="small muted">Qualitative strategic inference.</div></div><div class="methoditem"><b>ELO context</b><div class="small muted">Current-patch mode and rating-band samples, compared with faction-level context.</div></div></div>'+
    '<div class="goodnotice" style="margin-top:10px"><strong>v1.1.34 update:</strong> Opponent selectors remain removed. Recommendation cards show one battlegroup rate line per rating scope. Incomplete current-patch rating coverage does not affect the Advisor Score.</div>'+
    '<h3 style="margin-top:20px">Advisor Score</h3><p>The score starts from a neutral baseline, then adds profile confidence, average matchup rank, map fit, recovery safety and current-patch ELO-relative battlegroup context. It supports practical selection and is not a measured win probability.</p>'+
    '<div style="margin-top:14px">'+SOURCES.map(x=>'<div class="source"><div><strong>'+x.name+'</strong><div class="muted small">'+x.note+'</div></div><a href="'+x.url+'" target="_blank" rel="noopener noreferrer">Open ↗</a></div>').join("")+'</div>'+
    '<h3 style="margin-top:20px">Data architecture</h3><p>The v1.1.4 download remains a self-contained HTML file. The JSON export stores <code>battlegroupTrees</code> once per battlegroup and <code>battlegroupRecommendations</code> separately from mode profiles. The page validates strict recommendation paths against the canonical tree at runtime, so an illegal prerequisite jump or mutually exclusive sequence is blocked instead of displayed.</p></div>';
}
function switchView(v){['advisor','match','creators','rankings','sources'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));if(v==='match')renderMatch();if(v==='creators')renderCreators();if(v==='rankings')renderRank();if(v==='sources')renderSources()}
options(fac,uniq(PROFILES.map(p=>p.faction)));options(rfac,uniq(PROFILES.map(p=>p.faction)));refreshMain();refreshRankControls();refreshCreatorFilters();renderSources();
fac.addEventListener('change',refreshMain);mode.addEventListener('change',refreshBG);maptype.addEventListener('change',renderAdvisor);elo.addEventListener('change',renderAdvisor);bg.addEventListener('change',renderAdvisor);$("recommended").addEventListener('click',useRecommended);
rfac.addEventListener('change',refreshRankControls);rmode.addEventListener('change',renderRank);rmap.addEventListener('change',renderRank);relo.addEventListener('change',renderRank);[cname,cfac,cmode].forEach(e=>e.addEventListener('change',refreshCreatorBG));cbg.addEventListener('change',renderCreators);document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
</script>
