row{color:var(--accent2);font-weight:800;padding:0 3px}.notice{border-left:3px solid var(--yellow);padding:10px 12px;background:#171a16;border-radius:8px;color:#d7d1b5}.info{border-left:3px solid var(--blue);padding:10px 12px;background:#101923;border-radius:8px;color:#c0d4e8}.goodnotice{border-left:3px solid var(--green);padding:10px 12px;background:#101c17;border-radius:8px;color:#c5e6d1}.branchgrid{display:grid;grid-template-columns:1fr 1.15fr 1.35fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}.branchgrid>div{padding:9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.branchgrid>div:nth-child(3n){border-right:0}.head{background:var(--panel2);font-weight:700;color:var(--accent2)}ol,ul{line-height:1.55;padding-left:21px}.source{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:10px 0}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.hidden{display:none!important} .communitylinks{

.comparegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comparecol{background:#0d131a;border:1px solid var(--line);border-radius:10px;padding:12px}.stepchips{display:flex;gap:6px;flex-wrap:wrap}.stepchip{border:1px solid var(--line);padding:6px 8px;border-radius:999px;font-size:12px;background:var(--panel2)}.stepchip.only{border-color:#9b6a31;color:#ffd59c}.stepchip.shared{border-color:#315f4a;color:#bde6cf}.diffgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.diffbox{background:var(--panel2);border-radius:9px;padding:10px}.diffbox ul{margin:6px 0}.comparetop{display:flex;align-items:end;gap:10px;margin-bottom:10px}.comparetop>div{flex:1}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.statbox{background:#0d131a;border:1px solid var(--line);border-radius:9px;padding:10px}.statnum{font-size:20px;font-weight:800;color:var(--accent2)}.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statpill{background:#0d131a;border:1px solid var(--line);border-radius:9px;padding:9px}.creatorgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.creatorcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.creatorname{color:var(--accent2);font-weight:800}.creatorwarn{border-left:3px solid var(--blue);background:#101923;padding:9px 11px;border-radius:8px;margin:10px 0;color:#bed2e4}.pathbox{background:#0d131a;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:10px}.creatorfilters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--panel);padding:14px;border:1px solid var(--line);border-radius:14px;position:sticky;top:8px;z-index:9}.countbadge{display:inline-block;padding:4px 8px;border-radius:999px;background:#0d131a;border:1px solid var(--line);color:var(--muted);font-size:11px}.rankrow{display:grid;grid-template-columns:35px 1fr 105px 90px 2fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.rank{font-size:20px;font-weight:800;color:var(--accent2)}.variantgrid{display:grid;gap:10px}.variantcard{background:#0d131a;border:1px solid var(--line);border-radius:10px;padding:12px}.variantname{font-weight:800;color:var(--accent2);margin-bottom:4px}.variantwhen{font-size:12px;color:var(--muted);margin-bottom:8px}.favbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.favchip{background:#0d131a;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;cursor:pointer;color:var(--txt)}textarea{min-height:90px;resize:vertical}.saveok{display:none;color:var(--green);font-size:12px;margin-top:6px}.methodgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.methoditem{background:#0d131a;border:1px solid var(--line);border-radius:10px;padding:10px}.methoditem b{color:var(--accent2)}

.teamcontrols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:var(--panel);padding:14px;border:1px solid var(--line);border-radius:14px}.teamtable{width:100%;border-collapse:collapse;font-size:14px}.teamtable th,.teamtable td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left}.teamtable th{color:var(--accent2);background:var(--panel2);position:sticky;top:0}.teamtable td.num,.teamtable th.num{text-align:right;font-variant-numeric:tabular-nums}.teamtable tr:first-child td{background:#142019}.teamtablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.teamkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.teamkpi{padding:12px;background:#0d131a;border:1px solid var(--line);border-radius:10px}.teamkpi .big{font-size:24px;font-weight:800;color:var(--accent2)}.mapbar{height:7px;background:#24303d;border-radius:99px;overflow:hidden;margin-top:6px}.mapbar>span{display:block;height:100%;background:var(--blue)}

k 36 emplacement"],"tips":["Do not overuse Final Battle; the incoming-damage penalty is real.","Sturmpioneers are expensive and small—use cover and preserve models.","Emplacements are map tools, not your entire plan."],"branches":[],"profileType":"Current recommendation","legacy":null,"evidence":["Current Last Stand ability roster from CoH3Stats","Lower-confidence synthesis; limited direct current build intersection"],"techQa":"Verified against current 2.5.3 production/tech roster","techQaNotes":[]},{"faction":"Wehrmacht","battlegroup":"Luftwaffe","mode":"1v1","confidence":"High","verdict":"Recommended 251/Stummel Luftwaffe Battlegroup route: use Panzergrenadier Kompanie for the 251/Pak core, then scale with airborne infantry into conventional T4 armor. The Luftwaffe Kompanie is a separate T2 alternative, not the source of the 251.","build":["Start: Pioneer","Kettenkrad","Infanterie Kompanie","Fallschirmpioneer paradrop","MG42","Grenadier","Panzergrenadier Kompanie","251 Half-track","[SCOUT] enemy light-vehicle tech","Pak 40 first if enemy LV pressure","Stummel conversion when safe","Fallschirmjäger","Fallschirmjäger","Pak 40 if not already built","Panzergrenadier Officer Quarters after 2–3 benefiting units / when safe","Medical Bunker/Station","Panzer Kompanie","Panzer IV","Panzer IV / Brummbär"],"unlocks":["Fallschirmpioneer Squad Paradrop","LG40 Recoilless Gun Paradrop","Infantry Reserves","Stuka Strafing Run","Fallschirmjäger Squad Paradrop","Stuka Loiter"],"target":["Pioneer / Fallschirmpioneer","MG42","Grenadier","2 Fallschirmjägers","251 Stummel","Pak 40 when needed","2–3 Panzer IV / Brummbär"],"tips":["Tech legality: the Wehrmacht 251 Medium Carrier and Pak 40 are produced from the Panzergrenadier Kompanie. Luftwaffe Kompanie instead produces Jäger, 221, Flak 30, Marder and Wirbelwind.","Use the 251 as a reinforcement/transport platform first; convert to Stummel only when the enemy light-vehicle threat is covered.","Do not buy Panzergrenadier Officer Quarter function smartSection(){const rows=smartRows(fac.value,mode.value,opp.value,maptype.value,elo.value).slice(0,3);const favs=getFavorites().filter(k=>k.startsWith(`${fac.value}|${mode.value}|`));return `<div class="card" style="margin-top:14px"><h2>Smart recommendation</h2><div class="muted" style="margin-bottom:10px">Advisor Score combines profile confidence, opponent-specific ranking, map fit, recovery safety and relative CoHDB battlegroup performance in your selected ELO band. For <strong>4v4</strong>, the exact current-patch 4v4 battlegroup table adds a separate mode component. The ELO table remains all-modes and is never relabelled as mode-specific.</div><div class="smartgrid">${rows.map((x,i)=>`<div class="smartcard ${i===0?'first':''}"><div class="tags"><span class="tag">#${i+1}</span><span class="tag">${x.p.confidence}</span></div><h3>${x.p.battlegroup}</h3><div class="score">${x.score}<span class="small muted">/100</span></div><div class="scorebar"><span style="width:${x.score}%"></span></div><div class="smartreason">${smartReason(x)}</div><div class="scoreparts"><div class="scorepart"><b>+${x.confidence}</b>confidence</div><div class="scorepart"><b>+${x.rankBonus}</b>matchup</div><div class="scorepart"><b>${x.map>=0?'+':''}${x.map}</b>map</div><div class="scorepart"><b>${x.elo>=0?'+':''}${x.elo.toFixed(1)}</b>ELO</div><div class="scorepart"><b>${x.mode>=0?'+':''}${x.mode.toFixed(1)}</b>mode</div><div class="scorepart"><b>+${x.recovery}</b>recovery</div></div><div class="small muted" style="margin-top:8px">${x.eloInfo.label}${x.p.mode==='4v4'?` • ${x.modeInfo.label}`:''}</div><div class="smartactions"><button onclick="selectBG('${jsq(x.p.battlegroup)}')">Use build</button><button onclick="toggleFavoriteByName('${jsq(x.p.battlegroup)}')">★</button></div></div>`).join("")}</div>${favs.length?`<div class="favbar"><span class="muted small">Favorites:</span>${favs.map(k=>`<button class="favchip" onclick="selectBG('${jsq(k.split('|')[2])}')">★ ${k.split('|')[2]}</button>`).join("")}</div>`:""}</div>`}

function variantSection(p){if(!p.variants?.length)return "";return `<div class="card"><h3>Build choices / alternatives</h3><div class="variantgrid">${p.variants.map(x=>`<div class="variantcard"><div class="variantname">${x.name}</div><div class="variantwhen">Use when: ${x.when}</div><div class="build">${buildHtml(x.build)}</div><div class="small muted" style="margin-top:7px">${x.note}</div></div>`).join("")}</div></div>`}
function creatorMiniCard(c){return `<div class="creatorcard"><div class="creatorname">${c.creator}</div><h3>${c.title}</h3><div class="tags"><span class="tag">${c.faction}</span><span class="tag">${c.battlegroup}</span><span class="tag">${(c.modes||[]).join(' / ')}</span></div><div class="creatorwarn">${c.preserve||'Creator-original sequence preserved separately from the Current Advisor.'}</div><div class="build">${buildHtml(c.build)}</div>${c.path?.length?`<div class="pathbox"><strong>${c.pathLabel||'Battlegroup path'}</strong><ol>${c.path.map(x=>`<li>${x}</li>`).join("")}</ol></div>`:""}${c.notes?.length?`<details style="margin-top:10px"><summary>Creator notes / side choices</summary><ul>${c.notes.map(x=>`<li>${x}</li>`).join("")}</ul></details>`:""}<div class="small muted" style="margin-top:10px">${c.sourceLabel||''}</div></div>`}
function creatorInline(p){const cs=compareCandidates(p);return cs.length?`<div class="card"><h3>Relevant creator builds</h3><div class="creatorgrid">${cs.map(creatorMiniCard).join("")}</div></div>`:""}
function getFavorites(){try{return JSON.parse(localStorage.getItem('coh3-v7-favorites')||'[]')}catch(e){return []}}
function favoriteKey(){const p=currentProfile();return p?profileKey(p):''}
function isFavorite(){return getFavorites().includes(favoriteKey())}
function toggleFavorite(){const k=favoriteKey();if(!k)return;let a=getFavorites();a=a.includes(k)?a.filter(x=>x!==k):[...a,k];localStorage.setItem('coh3-v7-favorites',JSON.stringify(a));renderAdvisor()}
function toggleFavoriteByName(name){const k=`${fac.value}|${mode.value}|${name}`;let a=getFavorites();a=a.includes(k)?a.filter(x=>x!==k):[...a,k];localStorage.setItem('coh3-v7-favorites',JSON.stringify(a));renderAdvisor()}
function notesKey(){const p=currentProfile();return p?`coh3-v7-note:${profileKey(p)}`:''}
function saveNotes(){localStorage.setItem(notesKey(),$("profileNotes").value);$("saveok").style.display='block';setTimeout(()=>$("saveok").style.display='none',1200)}
function renderAdvisor(){const p=currentProfile();if(!p)return;const m=MATCHUPS?.[p.faction]?.[opp.value]||[],rec=recommendation(),score=scoreProfile(p,opp.value,maptype.value,elo.value),evidence=p.evidence?.length?`<ul>${p.evidence.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";$("advisorContent").innerHTML=`${smartSection()}<div class="layout"><main><div class="card"><div class="tags"><span class="tag">${p.faction}</span><span class="tag">${p.mode}</span><span class="tag">vs ${opp.value}</span><span class="tag">${maptype.value}</span><span class="tag">ELO ${elo.value}</span><span class="tag">${p.battlegroup}</span></div><h2>${p.battlegroup} <span class="score" style="font-size:24px">${score.score}/100</span></h2><p>${p.verdict}</p><p><strong>Confidence:</strong> <span class="conf ${cclass(p.confidence)}">${p.confidence}</span> • <strong>Style:</strong> ${BG_META?.[p.faction]?.[p.battlegroup]?.style||'Combined arms'}</p>${rec.p.battlegroup!==p.battlegroup?`<div class="notice">With your current filters the Smart Advisor prefers <strong>${rec.p.battlegroup}</strong> (${rec.score}/100). This page still shows the best stored shell for your selected ${p.battlegroup}.</div>`:''}<div class="smartactions"><button onclick="toggleFavorite()">${isFavorite()?'★ Favorite':'☆ Add favorite'}</button><button onclick="switchView('match')">Open Match Mode</button></div></div><div class="card"><h3>Exact build order</h3><div class="build">${buildHtml(p.build)}</div>${p.techQa?`<div class="goodnotice" style="margin-top:10px"><strong>Tech / production QA:</strong> ${p.techQa}.${(p.techQaNotes||[]).length?` <details style="margin-top:6px"><summary>Corrections / clarifications for this profile</summary><ul>${p.techQaNotes.map(x=>`<li>${x}</li>`).join("")}</ul></details>`:""}</div>`:""}</div>${phaseSection(p)}${variantSection(p)}${eloPanel(p)}${factionStatsSection(p)}<div class="card"><h3>${opp.value} matchup decisions</h3>${branchRows(m)}</div><div class="card"><h3>Battlegroup-specific decisions</h3>${branchRows(p.branches||[])}</div>${compareSection(p)}${creatorInline(p)}</main><aside><div class="card"><h3>Recommended battlegroup unlock path</h3><ol>${(p.unlocks||[]).map(x=>`<li>${x}</li>`).join("")}</ol><div class="small muted">Recommended order; CoHDB does not directly measure unlock order.</div></div><div class="card"><h3>Target composition</h3><ul>${(p.target||[]).map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="card"><h3>How to play it</h3><ol>${(p.tips||[]).map(x=>`<li>${x}</li>`).join("")}</ol></div><div class="card"><h3>Map fit</h3><div class="statnum">${mapComponent(p,maptype.value)>=0?'+':''}${mapComponent(p,maptype.value)}</div><p class="small muted">${MAP_INFO[maptype.value]}</p></div><div class="card"><h3>My notes</h3><textarea id="profileNotes" placeholder="Example: double Greyhound hurt me here...">${localStorage.getItem(notesKey())||''}</textarea><button class="action" style="margin-top:7px" onclick="saveNotes()">Save note</button><div id="saveok" class="saveok">Saved locally in this browser.</div></div><div class="card"><h3>Evidence layer</h3>${evidence}<div class="small muted">Patch ${PATCH}. Static profile evidence uses the 1600–1800 band as the primary high-level baseline unless stated otherwise; the Advisor Score / ELO panel reflects your currently selected band. ELO battlegroup rows are all-mode context and remain separate from exact-mode build archetypes. In 4v4, an additional exact-mode battlegroup row is shown and scored separately.</div></div></aside></div>`;if(compareCandidates(p).length)updateCompare(0);if(!$("advisorView").classList.contains('hidden')){} }
function findDecision(rows,words,fallback){const all=[...(rows||[])];const r=all.find(x=>words.some(w=>`${x[0]} ${x[1]}`.toLowerCase().includes(w)));return r||fallback}
function renderMatch(){const p=currentProfile();if(!p)return;const rows=[...(MATCHUPS?.[p.faction]?.[opp.value]||[]),...(p.branches||[])],sc=scoreProfile(p,opp.value,maptype.value,elo.value),lv=findDecision(rows,['lv','vehicle','motor pool','greyhound','stuart','8 rad','flak'],['Enemy light vehicle','Add real AT before greedy tech','Field safety first.']),inf=findDecision(rows,['infantry','mg','team-weapon','team weapon','rifle','section'],['Infantry / team weapons','Use your anti-infantry power spike and flanking tools','Avoid equal frontal trades.']),ahead=findDecision(rows,['ahead','fuel lead'],['You are ahead','Keep minimum AT, then accelerate the next major tech/power spike','Convert the lead without gambling it.']),behind=findDecision(rows,['behind','fuel-starved','fuel starved','lost fuel'],['You are behind','Healing + anti-vehicle safety before expensive tech','Stabilize the field first.']);$("matchContent").innerHTML=`<div class="matchwrap"><div class="matchhero"><div class="card"><div class="tags"><span class="tag">${p.faction}</span><span class="tag">${p.mode}</span><span class="tag">vs ${opp.value}</span><span class="tag">${maptype.value}</span><span class="tag">${p.battlegroup}</span></div><h2>${p.battlegroup}</h2><div class="matchbuild">${buildHtml(p.build)}</div></div><div class="card"><div class="matchscore">${sc.score}</div><div class="muted">Advisor Score / 100</div><p><strong>${elo.value}</strong>: ${sc.eloInfo.label}</p><button class="action" onclick="switchView('advisor')">Back to full advisor</button></div></div><div class="card"><h2>Decision buttons</h2><div class="decisiongrid">${[['Enemy LV?',lv],['Infantry / MG?',inf],['Ahead?',ahead],['Behind?',behind]].map(([t,r])=>`<div class="decision"><strong>${t}</strong><div>${r[1]}</div><div class="small muted" style="margin-top:6px">${r[2]}</div></div>`).join("")}</div></div><div class="card"><h2>Build by phase</h2><div class="phasegrid">${phaseBuild(p.build).map((ph,i)=>`<div class="phase"><h4>${i+1}. ${ph.name}</h4><div class="phasesteps">${ph.steps.map(x=>`<div class="phasestep">${x}</div>`).join("")}</div></div>`).join("")}</div></div><div class="card"><h2>Battlegroup path</h2><div class="phasegrid">${(p.unlocks||[]).map((x,i)=>`<div class="phase"><h4>${i+1}</h4><div>${x}</div></div>`).join("")}</div></div></div>`}
function useRecommended(){const r=recommendation();if(r){bg.value=r.p.battlegroup;renderAdvisor()}}
function refreshCreatorFilters(){options(cname,['All',...uniq(CREATOR_BUILDS.map(c=>c.creator)).sort()]);options(cfac,['All',...uniq(CREATOR_BUILDS.map(c=>c.faction)).sort()]);options(cmode,['All',...uniq(CREATOR_BUILDS.flatMap(c=>c.modes||[])).sort()]);refreshCreatorBG()}
function refreshCreatorBG(){let rows=CREATOR_BUILDS;if(cname.value!=='All')rows=rows.filter(c=>c.creator===cname.value);if(cfac.value!=='All')rows=rows.filter(c=>c.faction===cfac.value);if(cmode.value!=='All')rows=rows.filter(c=>(c.modes||[]).includes(cmode.value));const old=cbg.value;options(cbg,['All',...uniq(rows.map(c=>c.battlegroup)).sort()]);if([...cbg.options].some(o=>o.value===old))cbg.value=old;renderCreators()}
function renderCreators(){let rows=CREATOR_BUILDS;if(cname.value!=='All')rows=rows.filter(c=>c.creator===cname.value);if(cfac.value!=='All')rows=rows.filter(c=>c.faction===cfac.value);if(cmode.value!=='All')rows=rows.filter(c=>(c.modes||[]).includes(cmode.value));if(cbg.value!=='All')rows=rows.filter(c=>c.battlegroup===cbg.value);$("creatorContent").innerHTML=`<div class="card" style="margin-top:14px"><h2>Creator Build Library <span class="countbadge">${rows.length} shown / ${CREATOR_BUILDS.length} saved</span></h2><p class="muted">Original builds stay preserved. Use Current vs Creator in the Smart Advisor for a direct patch-aware comparison.</p></div><div class="creatorgrid">${rows.map(creatorMiniCard).join("")}</div>`}
function refreshRankControls(){options(rmode,uniq(PROFILES.filter(p=>p.faction===rfac.value).map(p=>p.mode)));options(ropp,ENEMIES[rfac.value]||[]);renderRank()}
function renderRank(){const rows=smartRows(rfac.value,rmode.value,ropp.value,rmap.value,relo.value);$("rankContent").innerHTML=`<div class="card" style="margin-top:14px"><h2>${rfac.value} ${rmode.value} vs ${ropp.value}</h2><p class="muted">Smart ranking for ${rmap.value}, ELO ${relo.value}. Score is a transparent advisor synthesis, not a proprietary CoHDB metric.</p>${rows.map((x,i)=>`<div class="rankrow"><div class="rank">${i+1}</div><div><strong>${x.p.battlegroup}</strong><div class="small muted">${BG_META?.[x.p.faction]?.[x.p.battlegroup]?.style||''}</div></div><div class="conf ${cclass(x.p.confidence)}">${x.p.confidence}</div><div><strong>${x.score}/100</strong></div><div class="muted">${smartReason(x)} • ${x.eloInfo.label}</div></div>`).join("")}</div>`}

function wilsonLB(w,n){if(!n)return 0;const z=1.96,p=w/n,z2=z*z;return (p+z2/(2*n)-z*Math.sqrt((p*(1-p)+z2/(4*n))/n))/(1+z2/n)}
function sampleLabel(n){if(n<30)return 'Too sparse';if(n<100)return 'Weak';if(n<300)return 'Useful / uncertain';return 'Stable descriptive'}
function renderTeamStats(){
 const m=tmode.value,f=tfaction.value,sort=tsort.value;
 const a=TEAM_ARCHETYPES[f], ar=a?.[m];
 const maps=TEAM_MAP_STATS[m]||[];
 let bgBlock='';
 if(m==='4v4'){
   const rows=Object.entries(TEAM_BG_STATS?.['4v4']?.[f]||{}).map(([name,r])=>({...r,name,lb:100*wilsonLB(r.w,r.n)}));
   rows.sort((x,y)=>sort==='wr'?y.wr-x.wr:sort==='n'?y.n-x.n:y.lb-x.lb);
   bgBlock=`<div class="card"><h2>Exact 4v4 battlegroup statistics — ${f}</h2><div class="info">CoHDB filter: <strong>Patch 2.5.3 • 4v4 • Balanced (all ratings) • All Maps</strong>. Sorted by ${sort==='wilson'?'95% Wilson lower bound':sort==='wr'?'raw win rate':'sample size'}. CoHDB's proprietary “Adjusted” metric is intentionally not used.</div><div class="teamtablewrap" style="margin-top:12px"><table class="teamtable"><thead><tr><th>#</th><th>Battlegroup</th><th class="num">Record</th><th class="num">Raw WR</th><th class="num">Selections</th><th class="num">95% Wilson LB</th><th>Sample</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><strong>${r.name}</strong></td><td class="num">${r.w.toLocaleString()}–${r.l.toLocaleString()}</td><td class="num">${r.wr.toFixed(1)}%</td><td class="num">${r.n.toLocaleString()}</td><td class="num">${r.lb.toFixed(1)}%</td><td>${sampleLabel(r.n)}</td></tr>`).join('')}</tbody></table></div><div class="small muted" style="margin-top:9px">Raw battlegroup WR describes selections in this exact filtered sample. It does not prove that the battlegroup caused the result.</div></div>`;
 }else{
   bgBlock=`<div class="card"><h2>3v3 battlegroup statistics</h2><div class="notice"><strong>Why there is no cached global 3v3 battlegroup table here:</strong> I could validate current exact 3v3 build-archetype and map data, but not reproducibly retrieve the global CoHDB 3v3 battlegroup table under the same static filter during this update. Rather than infer or mix filters, v8.3 links to the live table instead.</div><p style="margin-top:12px"><a href="https://cohdb.com/battlegroups?mode=threes&patch=49048" target="_blank" rel="noopener noreferrer">Open live CoHDB 3v3 battlegroups ↗</a></p></div>`;
 }
 const archetype=ar?`<div class="card"><h2>Representative exact-mode build archetype — ${f}</h2><div class="teamkpis"><div class="teamkpi"><div class="small muted">Archetype</div><div><strong>${a.name}</strong></div></div><div class="teamkpi"><div class="small muted">${m} record</div><div class="big">${ar.w.toLocaleString()}–${ar.l.toLocaleString()}</div></div><div class="teamkpi"><div class="small muted">Raw WR</div><div class="big">${ar.wr.toFixed(1)}%</div></div><div class="teamkpi"><div class="small muted">Games</div><div class="big">${ar.n.toLocaleString()}</div></div></div><p class="muted">${a.note}</p><a href="${a.url}" target="_blank" rel="noopener noreferrer">Open archetype on CoHDB ↗</a></div>`:'';
 const mapRows=maps.map(x=>`<tr><td>${x.map}</td><td class="num">${x.alliesWr.toFixed(1)}%</td><td class="num">${x.n.toLocaleString()}</td><td><div class="mapbar"><span style="width:${Math.max(0,Math.min(100,x.alliesWr))}%"></span></div></td></tr>`).join('');
 const mapBlock=`<div class="card"><h2>${m} map balance context</h2><div class="info">CoHDB map table: Patch 2.5.3 • Balanced (all ratings). <strong>Allies WR is overall map context</strong>, not a faction- or battlegroup-specific win rate.</div><div class="teamtablewrap" style="margin-top:12px"><table class="teamtable"><thead><tr><th>Map</th><th class="num">Allies WR</th><th class="num">Games</th><th>Balance bar</th></tr></thead><tbody>${mapRows}</tbody></table></div></div>`;
 const method=`<div class="card"><h2>How to read these team-game numbers</h2><div class="methodgrid"><div class="methoditem"><b>Battlegroup table</b><div class="small muted">Exact 4v4 mode + Balanced-all-ratings. Kept separate from build archetypes.</div></div><div class="methoditem"><b>Archetype</b><div class="small muted">Exact mode, but a build/tech cluster rather than a battlegroup. Late-tech categories can have survivorship bias.</div></div><div class="methoditem"><b>Map context</b><div class="small muted">Overall Allies map WR, not a specific army or BG.</div></div><div class="methoditem"><b>Wilson LB</b><div class="small muted">Conservative 95% lower bound used to avoid overrating smaller samples.</div></div></div></div>`;
 $('teamStatsContent').innerHTML=`<div style="margin-top:14px">${bgBlock}${archetype}${mapBlock}${method}</div>`;
}

function renderSources(){$("sourcesView").innerHTML=`<div class="card"><h2>Sources and methodology</h2><div class="notice"><strong>Patch status:</strong> CoHDB lists 2.5.3 as latest as of 08 Sep 2026. The 2.5.3 official notes are a hotfix; the broad multiplayer balance changes in this snapshot come from 2.5.0 plus subsequent fixes. The ELO selector now covers all six official CoHDB Average Rating bands: Under 1000, 1000–1200, 1200–1400, 1400–1600, 1600–1800 and 1800+. v8.6 keeps team-game context inside the Smart Advisor and includes a tech-legality correction for the Wehrmacht Luftwaffe 251/Stummel route: all four factions now have 1v1, 2v2, 3v3 and 4v4 profiles. Exact 4v4 battlegroup data and exact 3v3/4v4 faction archetype context remain separate statistical layers.</div><div class="goodnotice" style="margin-top:10px"><strong>Community / attribution note:</strong> This is an unofficial community project and is not affiliated with Relic, CoHDB, CoH3Stats or the featured creators. Creator builds are preserved from supplied videos, transcripts or screenshots and should not be read as creator endorsement of this advisor. Creator-original sequences may omit routine tech/building steps shown elsewhere in the source; the green tech-QA badge applies to Current Advisor profiles, not historical creator recaps.</div><div class="methodgrid" style="margin-top:12px"><div class="methoditem"><b>Confidence</b><div class="small muted">Current patch evidence quality.</div></div><div class="methoditem"><b>Matchup</b><div class="small muted">Existing opponent-specific advisor ranking.</div></div><div class="methoditem"><b>Map fit</b><div class="small muted">Qualitative strategic inference; not a fake map WR.</div></div><div class="methoditem"><b>ELO context</b><div class="small muted">Relative performance within the same faction plus sample stability.</div></div></div><div class="goodnotice" style="margin-top:10px"><strong>v8.6 full tech-legality audit:</strong> all 112 Current Advisor profiles across Wehrmacht, DAK, USF and British were checked against the current patch-2.5.3 production roster. Missing building prerequisites, tech upgrades and production unlocks were corrected. Creator-original builds remain unchanged and are labelled separately.</div><h3 style="margin-top:20px">Advisor Score</h3><p>The score starts from a neutral baseline, then adds profile confidence, opponent-specific rank, map fit, recovery safety and ELO-relative battlegroup context. It is designed for practical selection and is <strong>not</strong> presented as a measured win probability.</p><div style="margin-top:14px">${SOURCES.map(x=>`<div class="source"><div><strong>${x.name}</strong><div class="muted small">${x.note}</div></div><a href="${x.url}" target="_blank" rel="noopener noreferrer">Open ↗</a></div>`).join("")}</div><h3 style="margin-top:20px">Data architecture</h3><p>The v8.6 download remains a self-contained HTML file for easy local use. A separate JSON export is also provided so future patch updates can edit the structured profiles for all four factions, creator builds, rankings, ELO rows and map-fit metadata without reconstructing the page manually.</p></div>`}
function switchView(v){['advisor','match','creators','rankings','sources'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));if(v==='match')renderMatch();if(v==='creators')renderCreators();if(v==='rankings')renderRank();if(v==='sources')renderSources()}
options(fac,uniq(PROFILES.map(p=>p.faction)));options(rfac,uniq(PROFILES.map(p=>p.faction)));refreshMain();refreshRankControls();refreshCreatorFilters();renderSources();
fac.addEventListener('change',refreshMain);mode.addEventListener('change',refreshOpponents);opp.addEventListener('change',renderAdvisor);maptype.addEventListener('change',renderAdvisor);elo.addEventListener('change',renderAdvisor);bg.addEventListener('change',renderAdvisor);$("recommended").addEventListener('click',useRecommended);
rfac.addEventListener('change',refreshRankControls);rmode.addEventListener('change',renderRank);ropp.addEventListener('change',renderRank);rmap.addEventListener('change',renderRank);relo.addEventListener('change',renderRank);[cname,cfac,cmode].forEach(e=>e.addEventListener('change',refreshCreatorBG));cbg.addEventListener('change',renderCreators);document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
</script>
