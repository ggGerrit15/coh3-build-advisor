name: Sync battlegroup icons

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_bg_icons.mjs'
      - 'scripts/fix_bg_icon_swaps.mjs'
      - 'scripts/fix_bg_tree_layout.mjs'
      - 'scripts/clean_bg_tree_ui.mjs'
      - 'scripts/add_team_bg_orders.mjs'
      - 'scripts/embed_bg_recommendations.mjs'
      - 'scripts/clean_public_copy.mjs'
      - '.github/workflows/sync-battlegroup-icons.yml'

permissions:
  contents: write

jobs:
  sync-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate local battlegroup icon assets
        run: |
          synced=0
          for attempt in 1 2 3; do
            echo "Icon sync attempt ${attempt}/3"
            if node scripts/sync_bg_icons.mjs; then
              synced=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient download failure; retrying in 5 seconds..."
              sleep 5
            fi
          done
          if [ "$synced" -ne 1 ]; then
            echo "Full upstream sync was unavailable after 3 attempts. Continuing with the already committed local icon assets and report so targeted QA/fixes can still be applied."
          fi

      - name: Fix and audit battlegroup icon mappings
        run: node scripts/fix_bg_icon_swaps.mjs

      - name: Fix battlegroup tree layout
        run: node scripts/fix_bg_tree_layout.mjs

      - name: Clean battlegroup recommendation UI
        run: node scripts/clean_bg_tree_ui.mjs

      - name: Add 3v3 and 4v4 battlegroup orders
        run: node scripts/add_team_bg_orders.mjs

      - name: Embed battlegroup recommendations into live page
        run: node scripts/embed_bg_recommendations.mjs

      - name: Clean public-facing copy
        run: node scripts/clean_public_copy.mjs

      - name: Commit generated assets and site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html coh3_build_advisor_data.json assets/icons assets/bg-icons.json assets/bg-icons-report.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Clean public advisor copy"
          git push
