name: Validate advisor

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check imports and embedded data
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check page runtime and creator transcriptions
        run: node tests/test_cohdb_runtime.mjs
