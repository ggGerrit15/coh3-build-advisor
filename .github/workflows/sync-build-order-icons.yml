name: Sync build order icons

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_build_order_icons.mjs'
      - 'scripts/fix_build_icon_assets.mjs'
      - 'scripts/fix_known_build_icon_overrides.mjs'
      - 'scripts/fix_build_icon_rendering.mjs'
      - 'scripts/apply_verified_build_order_fixes.mjs'
      - '.github/workflows/sync-build-order-icons.yml'

permissions:
  contents: write

jobs:
  sync-build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply verified build-order content corrections
        run: node scripts/apply_verified_build_order_fixes.mjs --data

      - name: Vendor build-order icons from CoH3Stats
        run: node scripts/sync_build_order_icons.mjs

      - name: QA build-order icons against same-faction CoH3Stats CDN assets
        run: node scripts/fix_build_icon_assets.mjs

      - name: Apply known build-order icon corrections
        run: node scripts/fix_known_build_icon_overrides.mjs

      - name: Fix build-order icon rendering
        run: node scripts/fix_build_icon_rendering.mjs

      - name: Apply verified exact icon mappings
        run: node scripts/apply_verified_build_order_fixes.mjs --icons

      - name: Commit build-order data and icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coh3_build_advisor_data.json index.html assets/build-icons assets/build-icons.json assets/build-icons-report.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Apply verified Wehrmacht build order fixes"
          git pull --rebase origin main
          git push
